<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.Params.description }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  {{ with resources.Get "css/site.css" }}{{ $style := . | fingerprint }}<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">{{ end }}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <div class="site-shell header-content">
      <a class="wordmark" href="{{ site.Home.RelPermalink }}">Stagehand</a>
      <nav aria-label="Primary navigation">
        <a href="{{ site.Params.repositoryURL }}">Source code</a>
        <a href="{{ site.Params.planningURL }}">Project planning</a>
      </nav>
    </div>
  </header>
  {{ block "main" . }}{{ end }}
  <footer class="site-footer">
    <div class="site-shell footer-content">
      <p>Stagehand is an open-source project in active development.</p>
      <a href="{{ site.Params.repositoryURL }}">View on GitHub</a>
    </div>
  </footer>
</body>
</html>
